server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # DNS-резолвер з /etc/resolv.conf (див. NGINX_ENTRYPOINT_LOCAL_RESOLVERS у Dockerfile)
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s;

    # Бек не публічний: браузер ходить на /api/ фронта, nginx проксує всередину VPC.
    # Змінна змушує nginx резолвити ім'я на кожен запит — IP внутрішнього ALB змінюються.
    location /api/ {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
